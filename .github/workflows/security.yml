name: Distribution credential checks
on:
  push:
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  credentials:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install checksum-verified Gitleaks
        run: |
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/gitleaks.tar.gz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/gitleaks"
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/gitleaks" gitleaks
      - name: Check all repository history without printing secrets
        run: '"$RUNNER_TEMP/gitleaks/gitleaks" git --redact --no-banner --log-opts="--all" .'
      - name: Check the source bundle
        run: |
          mkdir -p "$RUNNER_TEMP/pbx-source-audit"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/pbx-source-audit"
          "$RUNNER_TEMP/gitleaks/gitleaks" dir --redact --no-banner "$RUNNER_TEMP/pbx-source-audit"
          node --input-type=module -e "import {assertSafeDistributionTree} from './packaging/distribution-safety.mjs'; await assertSafeDistributionTree(process.env.RUNNER_TEMP+'/pbx-source-audit');"
