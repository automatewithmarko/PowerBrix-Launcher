<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>PowerBrix Launcher disk image</title>
<style>
  @font-face{font-family:Manrope;src:url(../renderer/manrope.woff2);font-weight:200 800}
  *{box-sizing:border-box}
  body{margin:0;width:800px;height:460px;position:relative;overflow:hidden;color:#f8f4ff;font-family:Manrope,system-ui,sans-serif;background:radial-gradient(ellipse at 75% 47%,#49366f,#181329 78%);--wave-color:#473466}
  .wave-hero,.waves,.hero-wave-canvas,.shade{position:absolute;inset:0;width:100%;height:100%}
  .shade{background:linear-gradient(0deg,#120d20 0%,transparent 42%),linear-gradient(180deg,#17112786,transparent 35%)}
  .wordmark{position:absolute;top:52px;left:286px;width:228px;height:auto}
  .divider{position:absolute;top:119px;left:80px;right:80px;height:1px;background:linear-gradient(90deg,transparent,#ddc9ff45,transparent)}
  .target{position:absolute;top:156px;width:218px;height:163px;border:1px solid #cab3ff34;border-radius:22px;background:linear-gradient(152deg,#1a152673,#150f275e);box-shadow:0 12px 34px #0e0a192f}
  .target::after{content:"";position:absolute;bottom:11px;left:22px;right:22px;height:31px;border:1px solid #ebddff55;border-radius:8px;background:linear-gradient(180deg,#c7b6e3,#b5a2d4)}
  .target.left{left:93px}
  .target.right{right:93px}
  .trail{position:absolute;top:206px;left:337px;width:126px;height:52px}
  .hint{position:absolute;top:369px;left:30px;right:30px;margin:0;text-align:center;font-size:15px;font-weight:560;letter-spacing:.012em;color:#e5dbf3}
  .hint strong{color:#fff;font-weight:730}
</style>
<div class="wave-hero" aria-hidden="true"><div class="waves" data-hero-waves></div></div>
<div class="shade"></div>
<img class="wordmark" src="../renderer/powerbrix-wordmark.svg" alt="PowerBrix">
<div class="divider"></div>
<div class="target left"></div><div class="target right"></div>
<svg class="trail" viewBox="0 0 126 52" fill="none" aria-hidden="true">
  <defs>
    <linearGradient id="motion" x1="7" y1="22" x2="124" y2="22" gradientUnits="userSpaceOnUse">
      <stop stop-color="#efe4ff"/>
      <stop offset="1" stop-color="#ba9df7" stop-opacity=".22"/>
    </linearGradient>
  </defs>
  <path d="M125 22H92m-12 0H62m-12 0H8m10-10L8 22l10 10" stroke="url(#motion)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M53 26l17 9-8 1 3 8-3 2-4-8-6 5z" fill="#f5edff" stroke="#342746" stroke-width="1.4" stroke-linejoin="round"/>
</svg>
<p class="hint">Drag <strong>PowerBrix Launcher</strong> into <strong>Applications</strong>.</p>
<script src="../renderer/hero-waves.js"></script>
</html>
